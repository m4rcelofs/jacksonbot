<body>
	<nav class="navbar navbar-inverse navbar-fixed-top">
		<div class="container">
			<div class="navbar-header">
				<a class="navbar-brand"
					href="http://www.erepublik.com/en/referrer/nW0lf">Jackson Bot</a>
			</div>
			<div id="navbar" class="collapse navbar-collapse">
				<p class="navbar-text">Correndo atrás dos novinhos do eBR</p>

				<form id="dateForm" class="navbar-form navbar-right" role="search">
					<div class="form-group">
						<input id="date" type="date" class="form-control" min="2013-05-28" placeholder="aaaa-MM-dd">
					</div>
					<button type="submit" class="btn btn-default">
						<span class="glyphicon glyphicon-search"> </span>
					</button>
				</form>
			</div>
		</div>

	<div class="container">
		<div id="chart"></div>
	</div>

	<div class="modal fade" id="newUsers" tabindex="-1" role="dialog"
		aria-labelledby="newUsersLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">
				<div class="modal-header">
					<button type="button" class="close" data-dismiss="modal"
						aria-label="Fechar">
						<span aria-hidden="true">&times;</span>
					</button>
					<h4 class="modal-title" id="newUsersLabel">
						<span id="selectedLength"></span> novos jogadores no dia <span
							id="selectedDay"></span>
					</h4>
				</div>
				<div class="modal-body">
					<div class="row" id="userIdsRow"></div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-default" data-dismiss="modal">Fechar</button>
				</div>
			</div>
		</div>
	</div>

	<script
